name: Bootstrap FinanceCanvas source

on:
  push:
    paths:
      - financecanvas-bootstrap.zip.b64

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand reviewed source tree
        shell: bash
        run: |
          set -euo pipefail
          base64 -d financecanvas-bootstrap.zip.b64 > /tmp/financecanvas.zip
          unzip -q -o /tmp/financecanvas.zip -d .
          rm -f financecanvas-bootstrap.zip.b64 .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Publish FinanceCanvas v0.1.0"
          git push
