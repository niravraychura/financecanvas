name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install pinned test dependencies
        run: npm ci
      - name: Test migrations and import API
        run: npm test
      - name: Validate Node installer
        run: node --check bin/install.mjs
      - name: Compile helper scripts
        run: python -m py_compile scripts/*.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Run FinanceCanvas security gate
        run: python scripts/security_check.py
      - name: Reject common committed secret/data files
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env|.*\.pem|.*\.p12|.*\.pfx|.*\.sqlite3?|.*\.db)$' | grep -v '^\.env\.example$'; then
            echo 'Potential secret/data file is tracked.' >&2
            exit 1
          fi
      - name: Scan tracked text for obvious Supabase secret-key patterns
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE '(service_role|sb_secret_)[A-Za-z0-9._-]{16,}' -- . ':!README.md' ':!SECURITY.md' ':!.env.example'; then
            echo 'Potential Supabase secret detected.' >&2
            exit 1
          fi
