name: Agent Skill Install

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    env:
      DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install pinned test dependencies
        run: npm ci
      - name: Test install and migration bundles
        run: npm test
      - name: Validate Agent Skills discovery
        run: npx -y skills add . --list
      - name: Validate installer syntax
        run: node --check bin/install.mjs
      - name: Test public one-command FinanceCanvas installer
        env:
          HOME: ${{ runner.temp }}/financecanvas-home
        run: |
          mkdir -p "$HOME"
          npx --yes github:niravraychura/financecanvas
          test -f "$HOME/.agents/skills/financecanvas/SKILL.md"
          test -f "$HOME/.claude/skills/financecanvas/SKILL.md"
          test -f "$HOME/.cursor/skills/financecanvas/SKILL.md"
          test -f "$HOME/.codex/skills/financecanvas/SKILL.md"
          test -f "$HOME/.codex/skills/financecanvas/references/CONNECTOR_MODE.md"
          test -f "$HOME/.codex/skills/financecanvas/supabase/migrations/20261002063000_financecanvas_v01_connector_bootstrap.sql"
          test -f "$HOME/.codex/skills/financecanvas/supabase/migrations/20261002063500_financecanvas_v011_schema_version.sql"
          test -f "$HOME/.codex/skills/financecanvas/supabase/migrations/20261002071000_financecanvas_v011_connector_statement_import.sql"
          test -f "$HOME/.codex/skills/financecanvas/supabase/migrations/20261002072000_financecanvas_v012_connector_import_privacy.sql"
          test -f "$HOME/.codex/skills/financecanvas/supabase/migrations/20261002072500_financecanvas_v012_schema_version.sql"
          test -f "$HOME/.codex/skills/financecanvas/supabase/migrations/20261002075500_financecanvas_v013_connector_entity_import.sql"
          test -f "$HOME/.codex/skills/financecanvas/supabase/migrations/20261002082500_financecanvas_v014_salary_tax_import.sql"
          test -f "$HOME/.codex/skills/financecanvas/supabase/migrations/20261002084000_financecanvas_v013_privacy_constraints.sql"
          test -f "$HOME/.gemini/skills/financecanvas/SKILL.md"
          grep -q "name: financecanvas" "$HOME/.agents/skills/financecanvas/SKILL.md"
