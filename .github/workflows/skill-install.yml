name: Agent Skill Install

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    env:
      DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Validate Agent Skills discovery
        run: npx -y skills add . --list
      - name: Validate installer syntax
        run: node --check bin/install.mjs
      - name: Test public one-command FinanceCanvas installer
        env:
          HOME: ${{ runner.temp }}/financecanvas-home
        run: |
          mkdir -p "$HOME"
          npx --yes github:niravraychura/financecanvas
          test -f "$HOME/.agents/skills/financecanvas/SKILL.md"
          test -f "$HOME/.claude/skills/financecanvas/SKILL.md"
          test -f "$HOME/.cursor/skills/financecanvas/SKILL.md"
          test -f "$HOME/.codex/skills/financecanvas/SKILL.md"
          test -f "$HOME/.gemini/skills/financecanvas/SKILL.md"
          grep -q "name: financecanvas" "$HOME/.agents/skills/financecanvas/SKILL.md"
