name: Register skills.sh

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/register-skills-sh.yml"
      - "skills.sh.json"
      - "SKILL.md"

permissions:
  contents: read

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Register FinanceCanvas through official skills CLI
        env:
          HOME: ${{ runner.temp }}/financecanvas-home
        run: |
          mkdir -p "$HOME/.codex/skills"
          npx -y skills add https://github.com/niravraychura/financecanvas --skill financecanvas -g -a codex --copy -y
          if test -f "$HOME/.codex/skills/financecanvas/SKILL.md"; then
            echo "FinanceCanvas installed in the Codex skill directory."
          elif test -f "$HOME/.agents/skills/financecanvas/SKILL.md"; then
            echo "FinanceCanvas installed in the universal Agent Skills directory."
          else
            echo "FinanceCanvas was not found in an expected installed-skill directory." >&2
            find "$HOME" -type f -name SKILL.md -print || true
            exit 1
          fi
          echo "FinanceCanvas installed successfully through the official skills CLI with telemetry enabled."
