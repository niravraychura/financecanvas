name: Register skills.sh

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/register-skills-sh.yml"

permissions:
  contents: read

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Register FinanceCanvas through official skills CLI
        run: |
          mkdir -p .codex/skills
          npx -y skills add https://github.com/niravraychura/financecanvas --skill financecanvas -a codex --copy -y
          test -f .codex/skills/financecanvas/SKILL.md
          echo "FinanceCanvas installed successfully through the official skills CLI with telemetry enabled."
